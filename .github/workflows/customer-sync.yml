name: SHOPLINE Customer Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
      timezone: 'Asia/Taipei'

permissions:
  contents: read

concurrency:
  group: shopline-customer-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Sync SHOPLINE customers to SQL Server
        env:
          SHOPLINE_TOKEN: ${{ secrets.SHOPLINE_TOKEN }}
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_PORT: ${{ secrets.SQL_PORT }}
          SQL_DATABASE: ${{ secrets.SQL_DATABASE }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          SQL_ENCRYPT: ${{ vars.SQL_ENCRYPT }}
          SQL_TRUST_SERVER_CERTIFICATE: ${{ vars.SQL_TRUST_SERVER_CERTIFICATE }}
        run: npm run sync-customers
