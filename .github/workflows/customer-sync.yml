name: SHOPLINE Customer Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
      timezone: 'Asia/Taipei'

permissions:
  contents: read

concurrency:
  group: shopline-customer-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Validate customer sync
        run: npm run check

      - name: Sync SHOPLINE customers through fixed API
        env:
          SHOPLINE_TOKEN: ${{ secrets.SHOPLINE_TOKEN }}
          CUSTOMER_SYNC_BACKEND_KEY: ${{ secrets.CUSTOMER_SYNC_BACKEND_KEY }}
        run: npm run sync-customers
