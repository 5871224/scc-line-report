name: SHOPLINE LINE Report

on:
  workflow_dispatch:
  schedule:
    - cron: '50 7 * * *'
      timezone: 'Asia/Taipei'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Send SHOPLINE report to LINE
        env:
          SHOPLINE_TOKEN: ${{ secrets.SHOPLINE_TOKEN }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: npm start
